<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eceaf8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d0a26" />

    <!-- iOS: con estos tags "Agregar a inicio" abre a pantalla completa, sin
         barra de Safari, con su propio ícono. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Split.it" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Aplica el tema antes del primer pintado: sin esto, quien usa modo
         oscuro veía un destello claro mientras React arrancaba. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('splitit_theme_pref') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          // Color de la app elegido por la persona (ver src/utils/accent.js).
          var css = localStorage.getItem('splitit_accent_css');
          if (css) {
            var st = document.createElement('style');
            st.id = 'accent-style';
            st.textContent = css;
            document.head.appendChild(st);
            document.documentElement.setAttribute('data-accent', '');
          }
        } catch (e) {}
      })();
    </script>

    <title>Split.it</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
